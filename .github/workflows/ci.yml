name: CI

# Run on every push and pull request, plus a manual "Run workflow" button
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Job 1: run the pre-commit hooks (whitespace, end-of-file, YAML, large files)
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pylint   # Pylint runs in the build job, where the project's packages are installed

  # Job 2: install the project, then run Pylint with a score threshold
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # TensorFlow 2.10 needs Python 3.10
          cache: pip               # reuse downloaded packages to speed up later runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Analyse the code with Pylint
        run: python lint.py

      - name: Run tests with pytest
        run: pytest
